[tool.poetry]
name = "yfinance-api"
version = "0.1.0"
description = "FastAPI service for retrieving financial market data via yfinance"
authors = ["Lukas Petersdorf <lukas@petersdorf.family>"]
packages = [{include = "yfinance_api"}]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
fastapi = "^0.115.0"
uvicorn = {version = "^0.34.0", extras = ["standard"]}
yfinance = "^0.2.0"
pydantic = "^2.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
